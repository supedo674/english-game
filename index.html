<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6c63ff" />
  <title>英単語4択学習 Ver0.3</title>
  <style>
    :root{
      --bg:#f4f6fb;--card:#fff;--main:#6c63ff;--main2:#8b84ff;--text:#20243a;
      --sub:#6b7280;--ok:#20a464;--ng:#e84c5b;--line:#e6e8f0;--shadow:0 14px 35px rgba(32,36,58,.12)
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:linear-gradient(160deg,#eef0ff 0%,var(--bg) 45%,#f9fbff 100%);color:var(--text)}
    button,select{font:inherit}
    .app{width:min(100%,520px);margin:auto;min-height:100vh;padding:18px 16px calc(28px + env(safe-area-inset-bottom))}
    .title{text-align:center;margin:8px 0 18px}.title h1{font-size:1.55rem;margin:0 0 6px}.title p{margin:0;color:var(--sub);font-size:.92rem}
    .card{background:var(--card);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--shadow);padding:22px}
    .hidden{display:none!important}
    .setup-grid{display:grid;gap:16px}.field label{display:block;font-weight:700;margin-bottom:7px}.field select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--text)}
    .note{font-size:.82rem;color:var(--sub);line-height:1.6;background:#f7f7ff;border-radius:12px;padding:10px 12px}
    .primary,.secondary{width:100%;border:0;border-radius:15px;padding:14px 18px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--main),var(--main2));color:#fff;box-shadow:0 8px 18px rgba(108,99,255,.25)}.secondary{background:#eef0ff;color:var(--main)}
    .status{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:.92rem;margin-bottom:10px}.score{color:var(--main)}
    .progress{height:9px;background:#eceef5;border-radius:99px;overflow:hidden;margin-bottom:20px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--main),#a29cff);width:0;transition:.3s}
    .question-label{color:var(--sub);text-align:center;font-size:.9rem}.question{font-size:1.75rem;font-weight:900;text-align:center;margin:8px 0 6px;line-height:1.35}.part{text-align:center;color:var(--sub);font-size:.85rem;margin-bottom:20px}
    .choices{display:grid;gap:11px}.choice{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;text-align:left;font-weight:800;cursor:pointer;transition:.15s}.choice:active{transform:scale(.985)}.choice.correct{border-color:var(--ok);background:#eaf8f1;color:#157347}.choice.wrong{border-color:var(--ng);background:#fff0f2;color:#b42330}.choice:disabled{cursor:default}
    .feedback{min-height:66px;margin-top:16px;padding:12px 14px;border-radius:14px;background:#f7f8fc;line-height:1.55}.feedback strong{display:block;margin-bottom:2px}.example{font-size:.9rem;color:var(--sub)}
    .next{margin-top:14px}.result-score{text-align:center;font-size:3rem;font-weight:900;color:var(--main);margin:10px 0 0}.result-msg{text-align:center;font-weight:800;margin:2px 0 18px}.result-box{background:#f7f8fc;border-radius:16px;padding:14px;margin:14px 0}.result-box h3{font-size:1rem;margin:0 0 8px}.review-list{display:grid;gap:8px;font-size:.92rem}.review-item{padding:9px 10px;background:#fff;border-radius:10px;border:1px solid var(--line)}
    .actions{display:grid;gap:10px;margin-top:16px}.small{text-align:center;color:var(--sub);font-size:.78rem;margin-top:12px}
  </style>
</head>

  <main class="app">
    <header class="title"><h1>📘 英単語4択学習</h1><p>日本語に合う英単語を選んで覚えよう</p></header>

    <section id="setup" class="card">
      <div class="setup-grid">
        <div class="field"><label for="mode">学習内容</label><select id="mode"><option value="all">すべての単語</option><option value="noun">名詞を中心に学習</option><option value="verb">動詞・助動詞を中心に学習</option><option value="other">代名詞・形容詞などを学習</option><option value="review">間違えた単語だけ復習</option></select></div>
        <div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="all">全問</option></select></div>
        <div class="note">登録単語全体から出題します。現在は149語を収録。正解すると10点。不正解だった単語はこの端末に保存され、あとで復習できます。</div>
        <button id="startBtn" class="primary">学習を始める</button>
      </div>
    </section>

    <section id="quiz" class="card hidden">
      <div class="status"><span id="number">1 / 10</span><span class="score">スコア <span id="score">0</span></span></div>
      <div class="progress"><span id="bar"></span></div>
      <div class="question-label">この日本語に合う英単語は？</div>
      <div id="question" class="question"></div>
      <div id="part" class="part"></div>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden"></div>
      <button id="nextBtn" class="primary next hidden">次の問題へ</button>
    </section>

    <section id="result" class="card hidden">
      <div class="question-label">今回の結果</div>
      <div id="resultScore" class="result-score"></div>
      <div id="resultMsg" class="result-msg"></div>
      <div class="result-box"><h3>復習する単語</h3><div id="reviewList" class="review-list"></div></div>
      <div class="actions"><button id="retryBtn" class="primary">同じ設定でもう一度</button><button id="backBtn" class="secondary">設定に戻る</button><button id="clearBtn" class="secondary">間違い記録を消す</button></div>
      <div class="small">学習履歴はこのブラウザ内だけに保存されます。</div>
    </section>
  </main>

const $=id=>document.getElementById(id), shuffle=a=>[...a].sort(()=>Math.random()-.5);
let questions=[],index=0,score=0,wrong=[],answered=false,lastSettings={};
function getReview(){try{return JSON.parse(localStorage.getItem('englishWordReview')||'[]')}catch{return[]}}
function setReview(list){localStorage.setItem('englishWordReview',JSON.stringify([...new Set(list)]))}
function poolFromMode(value){
 if(value==='review'){const r=getReview();return words.filter(w=>r.includes(w.en));}
 if(value==='noun')return words.filter(w=>w.part.includes('名詞'));
 if(value==='verb')return words.filter(w=>w.part.includes('動詞')||w.part==='助動詞');
 if(value==='other')return words.filter(w=>!(w.part.includes('名詞')||w.part.includes('動詞')||w.part==='助動詞'));
 return [...words];
}
function begin(){
 const mode=$('mode').value,count=$('count').value;let pool=poolFromMode(mode);
 if(!pool.length){alert('復習する単語がまだありません。まず通常の問題に挑戦してください。');return;}
 lastSettings={mode,count}; const n=count==='all'?pool.length:Math.min(Number(count),pool.length);
 questions=shuffle(pool).slice(0,n);index=0;score=0;wrong=[];
 $('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion();
}
function showQuestion(){
 answered=false;$('feedback').classList.add('hidden');$('nextBtn').classList.add('hidden');
 const q=questions[index];$('number').textContent=`${index+1} / ${questions.length}`;$('score').textContent=score;$('bar').style.width=`${index/questions.length*100}%`;
 $('question').textContent=q.ja;$('part').textContent=q.part;$('choices').innerHTML='';
 const distractors=shuffle(words.filter(w=>w.en!==q.en)).slice(0,3);const opts=shuffle([q,...distractors]);
 opts.forEach((w,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${String.fromCharCode(65+i)}. ${w.en}`;b.onclick=()=>answer(b,w.en,q);$('choices').appendChild(b)});
}
function answer(button,chosen,q){
 if(answered)return;answered=true;const ok=chosen===q.en;document.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.textContent.endsWith(` ${q.en}`))b.classList.add('correct')});
 if(ok){score+=10;$('score').textContent=score;}else{button.classList.add('wrong');wrong.push(q.en);}
 const f=$('feedback');f.innerHTML=`<strong>${ok?'✅ 正解！':'❌ 不正解　正解：'+q.en}</strong><span class="example">例文：${q.ex}</span>`;f.classList.remove('hidden');
 $('nextBtn').textContent=index===questions.length-1?'結果を見る':'次の問題へ';$('nextBtn').classList.remove('hidden');$('bar').style.width=`${(index+1)/questions.length*100}%`;
}
function next(){index++;if(index>=questions.length)finish();else showQuestion()}
function finish(){
 const old=getReview(),correctNow=questions.filter(q=>!wrong.includes(q.en)).map(q=>q.en);let merged=old.filter(en=>!correctNow.includes(en));merged=[...new Set([...merged,...wrong])];setReview(merged);
 $('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(score/(questions.length*10)*100);$('resultScore').textContent=`${score}点`;
 $('resultMsg').textContent=pct===100?'全問正解！すばらしいです！':pct>=80?'よくできました！':pct>=60?'あと少し！復習して再挑戦しよう':'間違えた単語をゆっくり復習しよう';
 const list=$('reviewList');list.innerHTML='';if(!wrong.length)list.innerHTML='<div class="review-item">今回、間違えた単語はありません。</div>';else [...new Set(wrong)].forEach(en=>{const w=words.find(x=>x.en===en);list.innerHTML+=`<div class="review-item"><strong>${w.en}</strong> ＝ ${w.ja}<br><span class="example">${w.ex}</span></div>`});
}
$('startBtn').onclick=begin;$('nextBtn').onclick=next;$('retryBtn').onclick=()=>{$('mode').value=lastSettings.mode;$('count').value=lastSettings.count;begin()};$('backBtn').onclick=()=>{$('result').classList.add('hidden');$('setup').classList.remove('hidden')};$('clearBtn').onclick=()=>{if(confirm('保存した間違い記録を消しますか？')){localStorage.removeItem('englishWordReview');alert('間違い記録を消しました。')}};
</script>
